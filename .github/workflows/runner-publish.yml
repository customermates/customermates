name: Publish Runner

on:
  push:
    branches: [main]
    paths:
      - packages/runner/**
      - .github/workflows/runner-publish.yml
  workflow_dispatch:
  # Pull requests that change the runner build the image for both platforms and pack the npm package without publishing.
  pull_request:
    branches: [main]
    paths:
      - packages/runner/**
      - .github/workflows/runner-publish.yml

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/customermates/runner
  PACKAGE_DIRECTORY: packages/runner

concurrency:
  group: runner-publish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            slug: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ env.PACKAGE_DIRECTORY }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=runner-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=runner-${{ matrix.slug }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-digest-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image-tags:
    name: publish the image tags
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: image
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Read the runner version
        run: echo "VERSION=$(jq -r .version "${PACKAGE_DIRECTORY}/package.json")" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: runner-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish latest and the version as multi-platform tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create -t "${IMAGE}:latest" -t "${IMAGE}:${VERSION}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"

  npm:
    name: npm package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Lets npm sign a provenance statement and, once a trusted publisher is set up on npmjs.com, publish without a token.
      id-token: write
    defaults:
      run:
        working-directory: packages/runner
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install --global npm@11

      - name: Install the build tools
        run: npm install --no-save --no-audit --no-fund typescript@5.6.3 @types/node@24

      - name: Pack and start the packed runner
        run: |
          npm pack
          npx --yes --package "./customermates-runner-$(jq -r .version package.json).tgz" customermates-runner --help

      - name: Check whether this version is already on npm
        id: published
        if: github.event_name != 'pull_request'
        run: |
          version="$(jq -r .version package.json)"
          if npm view "customermates-runner@${version}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether an npm token is stored
        id: token
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "$NPM_TOKEN" ]; then echo "stored=true" >> "$GITHUB_OUTPUT"; else echo "stored=false" >> "$GITHUB_OUTPUT"; fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish with the npm token
        if: github.event_name != 'pull_request' && steps.published.outputs.exists == 'false' && steps.token.outputs.stored == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Without a token npm signs in through the trusted publisher set up for this workflow on npmjs.com.
      - name: Publish as trusted publisher
        if: github.event_name != 'pull_request' && steps.published.outputs.exists == 'false' && steps.token.outputs.stored == 'false'
        run: npm publish --provenance --access public
