name: Page shipping E2E

on:
  workflow_call:

permissions:
  contents: read

jobs:
  rendered-hubs:
    name: rendered-hubs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_MODE: self-hosted
      BASE_URL: http://127.0.0.1:4499
      BETTER_AUTH_SECRET: synthetic-page-shipping-e2e-secret
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/customermates_page_shipping_e2e
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: ./.github/actions/setup
      - name: Download the self-hosted build shared with the browser suite
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-self-hosted
      - name: Unpack the production build and write its synthetic environment
        run: |
          tar --zstd -xf build.tar.zst
          rm build.tar.zst
          node --input-type=module -e "import { writeEnvFile } from './scripts/verify/lib/app-copy.mjs'; writeEnvFile(process.cwd(), 'self-hosted', { databaseUrl: process.env.DATABASE_URL, secret: process.env.BETTER_AUTH_SECRET });"
      - name: Crawl rendered landing hubs and every sitemap URL
        shell: bash
        run: |
          set -euo pipefail

          server_log="$RUNNER_TEMP/page-shipping-server.log"
          yarn next start -H 127.0.0.1 -p 4499 >"$server_log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for _attempt in {1..60}; do
            if curl --silent --show-error --fail http://127.0.0.1:4499/en/blog >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$server_log"
              exit 1
            fi
            sleep 1
          done

          if [[ "$ready" -ne 1 ]]; then
            cat "$server_log"
            exit 1
          fi

          if ! HUB_E2E_BASE_URL=http://127.0.0.1:4499 yarn vitest run tests/conventions/hub-reachability.test.ts tests/conventions/sitemap-reachability.test.ts; then
            cat "$server_log"
            exit 1
          fi
