name: Report ready Preview domain

on:
  deployment_status:

permissions:
  contents: read

jobs:
  report:
    if: >-
      github.repository == 'customermates/customermates' &&
      github.event.deployment.creator.login == 'vercel[bot]' &&
      github.event.deployment.environment == 'Preview' &&
      github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Record the completed Vercel deployment
        env:
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
          DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url }}
        run: |
          set -euo pipefail
          [[ "$DEPLOYMENT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOYMENT_URL" =~ ^https://[a-z0-9-]+\.vercel\.app/?$ ]]
          jq -cn --arg deploymentUrl "${DEPLOYMENT_URL%/}" --arg sha "$DEPLOYMENT_SHA" \
            '{deploymentUrl: $deploymentUrl, sha: $sha}' > preview-domain-request.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-domain-request
          path: preview-domain-request.json
          retention-days: 1
