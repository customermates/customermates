name: Ubuntu 26 probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-policy-script:
    name: repository-policy script on ubuntu-26.04
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: customermates/.github
          ref: 2af0536c426fd2f2d9353b63e97a5ddf8e639520
          path: .repository-policy
          persist-credentials: false
      - name: Validate branch, commits, title, and description
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .repository-policy/repository-policy/validate.sh

  docker-build:
    name: docker image build on ubuntu-26.04
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: false
