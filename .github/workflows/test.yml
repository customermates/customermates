name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ci
    runs-on: ubuntu-latest
    env:
      APP_MODE: self-hosted
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/customermates_test"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: customermates_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d customermates_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn db:reset
      - name: Verify the synthetic seed is idempotent
        run: |
          npx --no-install prisma db seed
          npx --no-install prisma db seed
      - run: yarn openapi:generate
      - run: yarn raw-docs:generate
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn test
      - name: Test self-host webhook delivery
        run: yarn test:docker-runtime
