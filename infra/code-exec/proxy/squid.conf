# CONNECT-allowlist egress proxy for code-exec NET mode.
# Only allows HTTPS CONNECT to allowlisted destination domains; everything else is
# denied. The allowlist file is generated from the ALLOWLIST env at container start
# (see entrypoint.sh). Access is logged to stdout (-> CloudWatch) with the target.

http_port 3128

# Allowlisted CONNECT destinations (one per line, e.g. ".pypi.org"). Subdomain match.
acl allowed_dst dstdomain "/etc/squid/allowlist.txt"

acl SSL_ports port 443
acl CONNECT method CONNECT

# CONNECT only to 443, only to allowlisted hosts. Deny everything else (incl. plain HTTP).
http_access deny CONNECT !SSL_ports
http_access allow CONNECT allowed_dst
http_access deny all

# Log every request with the destination so exfiltration attempts are auditable.
# NOTE: %ssl::>sni was dropped — it requires SSL-bump support this image's Squid
# build doesn't have ("Unsupported %code"), confirmed via a real container crash on
# a live ECS deploy (Squid FATALs on an unparseable logformat at startup, not just a
# warning). We don't ssl_bump anyway (plain CONNECT tunneling, not inspection), so
# there was no real SNI data behind that token regardless — %ru already captures the
# CONNECT target ("host:443") for our exact use case.
logformat runlog %ts.%03tu %>a %Ss/%03>Hs %rm %ru
# Log to a real file `proxy` (Squid's dropped-privilege cache_effective_user) can
# write, NOT stdout directly. Both `stdio:` and `daemon:` modules targeting
# /dev/stdout were tried and confirmed broken here: `stdio:/dev/stdout` FATALs
# ("parent directory must be writeable by the user 'proxy'" — true even for the
# stdout device node) and `daemon:/dev/stdout` starts but dies moments later
# ("error writing (32) Broken pipe"). entrypoint.sh tails this file to the
# container's actual stdout instead (the standard container-logging workaround for
# exactly this class of problem), decoupling CloudWatch delivery from Squid's own
# privilege-drop/fd quirks entirely.
access_log /var/log/squid/access.log runlog

# Don't leak proxy identity / cache anything.
via off
forwarded_for delete
httpd_suppress_version_string on
